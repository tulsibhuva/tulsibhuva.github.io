<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="description" content="Robot Smart Homes - Landing Page - 2025 - Web Design. UI/UX case study by Tulsi Bhuva."><link rel="icon" type="image/png" href="../../favicon.png"><title>Robot Smart Homes - Tulsi Bhuva</title>
<link rel="stylesheet" href="../../styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../responsive.css">
<script src="../../responsive.js" defer></script>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.TPortfolioDesignSystem_31bff0;
const { Nav, Button, Badge, ScrollTopButton } = NS;
function App() {
  const [navVis, setNavVis] = React.useState(true);
  const lastY = React.useRef(0);
  React.useEffect(() => {
    const onScroll = () => { const y = window.scrollY; setNavVis(y < 80 || y < lastY.current); lastY.current = y; };
    window.addEventListener('scroll', onScroll, {passive:true});
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--text)'}}>
      <div style={{position:'fixed',top:0,left:0,right:0,zIndex:9999,padding:'20px 32px',pointerEvents:'none',transform:navVis?'translateY(0)':'translateY(-120%)',transition:'transform .35s ease'}}>
        <div style={{maxWidth:1200,margin:'0 auto',pointerEvents:'auto'}}>
          <Nav brand={<img src="../../logo.png" alt="Logo" style={{width:58,height:57,borderRadius:'50%',objectFit:'cover'}} />} links={[{label:'My Work',href:'../../index.html#work'},{label:'About Me',href:'../../index.html#about'},{label:'Experience',href:'../../index.html#experience'},{label:'Services',href:'../../index.html#services'},{label:'Tools',href:'../../index.html#tools'}]} cta={<Button variant="accent" size="sm" onClick={()=>{const f=document.getElementById('contact'); if(f) window.scrollTo({top:f.getBoundingClientRect().top+window.scrollY-40,behavior:'smooth'});}} style={{height:44,width:136,justifyContent:'center',fontSize:16}}>Let's talk</Button>} />
        </div>
      </div>
      <header style={{maxWidth:1200,margin:'140px auto 0',padding:'0 32px'}}>
        <div style={{display:'flex',gap:12,marginBottom:24}}>
          <Badge tone="outline">UI/UX</Badge>
          <Badge tone="outline">Web Design</Badge>
        </div>
        <h1 style={{fontSize:'clamp(48px,7vw,96px)',fontWeight:500,letterSpacing:'-.035em',lineHeight:1,margin:'0 0 16px',fontFamily:'Montserrat, var(--font-sans)'}}>Robot Smart Homes</h1>
        <p style={{fontSize:20,color:'var(--text-muted)',maxWidth:'60ch',margin:'0 0 48px',lineHeight:1.5}}>Landing Page · 2025 · Web Design</p>
        <div style={{aspectRatio:'16/9',borderRadius:'var(--radius-5)',overflow:'hidden',border:'1px solid var(--border)'}}>
          <img src="./thumb.png" alt="Robot Smart Homes hero" style={{width:'100%',height:'100%',objectFit:'cover'}} />
        </div>
      </header>
      <section style={{maxWidth:900,margin:'80px auto',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:24,fontFamily:'Montserrat, var(--font-sans)'}}>Overview</h2>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}></p>
        <p dir="ltr" style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}>Robot Smart Homes is an Australian smart‑home installation company. Their existing website tries to sell everything at once - lighting, climate, security, audio, networking - across a broad, video‑heavy homepage aimed at both homeowners and installer‑partners. The result is a site that explains the <em>company</em> well, but doesn't convert a visitor who arrived with one specific job in mind.</p>
        <div style={{borderRadius:'var(--radius-5)',overflow:'hidden',marginBottom:48}}>
          <img src="./team.png" alt="Robot Smart Homes team" style={{width:'100%',display:'block'}} />
        </div>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:24}}></h2>
        <p dir="ltr" style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}>For this project I was briefed to design a <strong>standalone, conversion‑focused landing page</strong> for a single high‑intent service: smart garage and gate automation. The page had to follow a fresh set of brand guidelines while still feeling premium, trustworthy, and unmistakably "Robot."</p>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:24,fontFamily:'Montserrat, var(--font-sans)'}}>My Approach</h2>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}>My approach was to build a page around one clear promise - open your garage or gate from anywhere, stay in control, stay secure - and remove every distraction between that promise and the booking action. I used a glassmorphism visual system layered over alternating light and dark sections to give the page depth and a high‑end product feel, paired with an animated lightning CTA to keep the primary action visually "alive" as users scroll. The layout is intentionally minimal, catchy, and paced so that trust, proof, and pricing arrive exactly when a buyer starts asking those questions.</p>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:32,fontFamily:'Montserrat, var(--font-sans)'}}>Design Challenges</h2>
        <div style={{display:'flex',flexDirection:'column',gap:32}}>
          {[
            ['A brand that sold everything, so it sold nothing clearly.','The original site spreads attention across five service categories and two audiences on one page. A visitor who just wants a garage upgrade has to self‑filter through content that isn\'t for them. I solved this by designing a single‑intent landing page - one service, one audience, one promise in the hero - so the visitor immediately knows "this is exactly what I came for."'],
            ['Smart‑home tech feels intimidating and "too technical" for everyday buyers.','Automation copy often drowns people in specs. The design challenge was to make advanced tech feel effortless and human. I led with outcome‑based language ("No more garage worries," "Stay in control") and used friendly icon‑led benefit cards instead of feature lists, so the value lands emotionally before any technical detail appears.'],
            ['Building trust for a high‑consideration, in‑home service.','Letting a company install hardware on your home is a high‑trust decision. I designed a layered trust journey - certified‑tech and warranty badges, a "Licensed Electricians + IT Specialists" positioning diagram, a 30‑day check‑in step, and a genuine "family business" story - so credibility is reinforced repeatedly rather than asked for once.'],
            ['Pricing anxiety killing conversions before contact.','Quote‑only smart‑home pricing forces users to commit before they know the cost, which drives drop‑off. I designed transparent tiered packages ($1,190 / $1,499 / $3,800) with a highlighted "most popular" plan, clear savings badges, and itemized inclusions - removing the "how much will this cost me?" fear that usually blocks the booking.'],
            ['Making a premium visual style without hurting usability.','Glassmorphism looks gorgeous but can wreck contrast and legibility. The challenge was premium and readable. I controlled it by pairing frosted‑glass cards with strong dark/light section backgrounds, keeping type high‑contrast on solid zones and reserving the glass effect for accent surfaces - so the page feels luxe without sacrificing scanability.'],
            ['Keeping one action always within reach.','On long landing pages the CTA gets lost mid‑scroll. I solved this with a persistent, animated lightning CTA and a sticky side "Book My Garage Upgrade" tab, so the primary action is never more than a glance away no matter how far the user has scrolled.'],
          ].map(([title,desc],i)=>(
            <div key={i} style={{paddingBottom:32,borderBottom:'1px solid var(--border)'}}>
              <div style={{display:'flex',gap:16,alignItems:'baseline',marginBottom:12}}>
                <span style={{fontSize:14,fontWeight:700,color:'#D97A2B',flexShrink:0}}>{String(i+1).padStart(2,'0')}</span>
                <h3 style={{fontSize:20,fontWeight:600,margin:0,background:'linear-gradient(90deg, #D97A2B, #F2B361, #FFE8C2)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{title}</h3>
              </div>
              <div style={{fontSize:16,lineHeight:1.7,color:'var(--text-muted)',paddingLeft:38}}>{desc}</div>
            </div>
          ))}
        </div>
      </section>

      {/* UX PROBLEMS SOLVED */}
      <section style={{maxWidth:900,margin:'0 auto 80px',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:600,letterSpacing:'-.02em',marginBottom:40,fontFamily:'Montserrat, var(--font-sans)'}}>UX Problems Solved</h2>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:20}}>
          {[
            ['M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z','Clear single value proposition above the fold.','The hero states the outcome and the benefit in one line, so users understand what the page offers within seconds.'],
            ['M4 6h16M4 12h16M4 18h7','Reduced decision fatigue.','By stripping the multi‑service homepage down to one service, users aren\'t forced to filter irrelevant content, lowering cognitive load.'],
            ['M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z','Benefit‑first information hierarchy.','Icon‑led benefit cards appear before technical inclusions, matching how buyers actually decide.'],
            ['M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z','A guided, low‑anxiety journey.','The three‑step section sets expectations up front - schedule, install, 30‑day check‑in - reducing hesitation.'],
            ['M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z','Transparent, scannable pricing.','Tiered cards with a highlighted plan and savings badges let users self‑qualify and compare at a glance.'],
            ['M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5','Persistent, obvious primary action.','The animated CTA plus sticky booking tab ensure the next step is always visible.'],
            ['M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z','Trust signals at the point of doubt.','Warranty, certified‑tech, and local cues sit beside benefits and pricing - where doubt surfaces.'],
            ['M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01','Objection handling built into the flow.','The FAQ answers practical fears that typically stop a purchase, right before the final contact form.'],
            ['M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z','A frictionless final step.','The closing form is short and outcome‑framed, so the last action feels like reassurance rather than a hurdle.'],
          ].map(([iconPath,title,desc],i)=>(
            <div key={i} style={{padding:24,borderRadius:16,background:'rgba(255,255,255,.06)',backdropFilter:'blur(20px)',border:'1px solid rgba(255,255,255,.1)',display:'flex',flexDirection:'column',gap:16}}>
              <div style={{width:56,height:56,borderRadius:'50%',background:'linear-gradient(135deg, #D97A2B, #F2B361, #FFE8C2)',padding:1,flexShrink:0}}>
                <div style={{width:'100%',height:'100%',borderRadius:'50%',background:'rgba(20,20,22,.85)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d={iconPath}/></svg>
                </div>
              </div>
              <div style={{fontSize:16,fontWeight:600,fontFamily:'Montserrat, var(--font-sans)',background:'linear-gradient(90deg, #D97A2B, #F2B361, #FFE8C2)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>{title}</div>
              <div style={{fontSize:14,lineHeight:1.6,color:'var(--text-muted)'}}>{desc}</div>
            </div>
          ))}
        </div>
      </section>

      {/* FINAL DESIGN */}
      <section style={{maxWidth:1200,margin:'0 auto 80px',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:600,letterSpacing:'-.02em',marginBottom:32,fontFamily:'Montserrat, var(--font-sans)',textAlign:'center'}}>Final Design</h2>
        <div style={{borderRadius:'var(--radius-5)',overflow:'hidden',border:'1px solid var(--border)'}}>
          <img src="./final-design.png" alt="Robot Smart Homes Final Design" style={{width:'100%',display:'block'}} />
        </div>
      </section>

      
      {/* EXPLORE MORE */}
      <div style={{textAlign:'center',padding:'60px 32px 0'}}>
        {(()=>{
          const [h, setH] = React.useState(false);
          return <a href="../../index.html#work" onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{display:'inline-flex',alignItems:'center',gap:10,padding:'14px 36px',borderRadius:999,background:h?'#fff':'var(--accent)',color:h?'var(--accent)':'var(--ink-0)',textDecoration:'none',fontSize:18,fontFamily:'var(--font-sans)',fontWeight:500,transition:'all .2s ease',transform:h?'scale(1.04)':'scale(1)',boxShadow:h?'0 0 20px rgba(137,91,138,.4)':'none',border:h?'1px solid rgba(255,255,255,.35)':'1px solid transparent'}}>Explore More Work →</a>;
        })()}
      </div>

      {/* FOOTER */}
      <footer id="contact" style={{padding:'120px 32px 80px',maxWidth:1200,margin:'0 auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:80,alignItems:'start'}}>
          <div>
            <img src="../../logo.png" alt="Tulsi Bhuva" style={{width:58,height:57,borderRadius:'50%',objectFit:'cover',marginBottom:24}} />
            <div style={{fontSize:22,fontWeight:500,letterSpacing:'-.02em',lineHeight:1.4,marginBottom:16}}>Hi. 3 years in, 40+ things shipped. I don't chase trends. I don't design for Dribbble. I don't ship what I wouldn't click on myself.</div>
            <div style={{display:'flex',flexDirection:'column',gap:8,color:'var(--text-muted)',marginBottom:20,maxWidth:'52ch',lineHeight:1.6}}><div>Drop me a note with the role, the company, and what the team is building - I'll reply within a day.</div><div>Open to full-time, contract, or freelance. Remote-first, based in Ahmedabad (IST).</div></div>
            <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:32}}>
              <a href="mailto:tulsibhuva4040@gmail.com" style={{display:'inline-flex',alignItems:'center',gap:10,textDecoration:'none',color:'var(--text-muted)',fontSize:15}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                tulsibhuva4040@gmail.com
              </a>
              <div style={{display:'inline-flex',alignItems:'center',gap:10,color:'var(--text-muted)',fontSize:15}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                Ahmedabad, India
              </div>
            </div>
            <a href="https://www.linkedin.com/in/tulsi-bhuva-0212ab23a/" target="_blank" rel="noopener"><Button variant="accent" size="lg" iconLeft={<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>}>Let's Talk</Button></a>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:16,paddingTop:8}}>
            {[
              ['LinkedIn','https://www.linkedin.com/in/tulsi-bhuva-0212ab23a/'],
              ['Behance','https://www.behance.net/tulsiibhuva'],
              ['Dribbble','https://dribbble.com/TulsiBhuva'],
              ['Instagram','https://www.instagram.com/_tulsi_bhuva/'],
            ].map(([label,href],i)=>{
              const [h, setH] = React.useState(false);
              return (
              <a key={i} href={href} target="_blank" rel="noopener" onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'20px 0',borderBottom:'1px solid var(--border)',textDecoration:'none',color:h?'var(--accent-light)':'var(--text)',fontSize:18,fontWeight:500,transition:'color .2s ease, padding-left .2s ease',paddingLeft:h?8:0}}>
                {label} <span style={{color:h?'var(--accent-light)':'var(--text-dim)',fontSize:14,transition:'color .2s ease, transform .2s ease',transform:h?'translateX(4px)':'none',display:'inline-block'}}>→</span>
              </a>
            );})}
          </div>
        </div>
        <div style={{marginTop:80,paddingTop:24,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',color:'var(--text-dim)',fontSize:13,fontFamily:'var(--font-mono)'}}>
          <div>Designed & built by Tulsi Bhuva</div>
          <div style={{display:'flex',alignItems:'center',gap:24}}>
            <div>© 2026</div>
            <ScrollTopButton />
          </div>
        </div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
