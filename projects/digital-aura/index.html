<!doctype html><html><head><meta charset="utf-8"><title>Digital Aura Marketing - Tulsi Bhuva</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.TPortfolioDesignSystem_31bff0;
const { Nav, Button, Badge } = NS;
function App() {
  const [navVis, setNavVis] = React.useState(true);
  const lastY = React.useRef(0);
  React.useEffect(() => {
    const onScroll = () => { const y = window.scrollY; setNavVis(y < 80 || y < lastY.current); lastY.current = y; };
    window.addEventListener('scroll', onScroll, {passive:true});
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--text)'}}>
      <div style={{position:'fixed',top:0,left:0,right:0,zIndex:9999,padding:'20px 32px',pointerEvents:'none',transform:navVis?'translateY(0)':'translateY(-120%)',transition:'transform .35s ease'}}>
        <div style={{maxWidth:1200,margin:'0 auto',pointerEvents:'auto'}}>
          <Nav brand={<img src="../../logo.png" alt="Logo" style={{width:58,height:57,borderRadius:'50%',objectFit:'cover'}} />} links={[{label:'My Work',href:'../../index.html#work'},{label:'About Me',href:'../../index.html#about'},{label:'Experience',href:'../../index.html#experience'},{label:'Services',href:'../../index.html#services'},{label:'Tools',href:'../../index.html#tools'}]} cta={<Button variant="accent" size="sm" onClick={()=>{const f=document.getElementById('contact'); if(f) window.scrollTo({top:f.getBoundingClientRect().top+window.scrollY-40,behavior:'smooth'});}} style={{height:44,width:136,justifyContent:'center',fontSize:16}}>Let's talk</Button>} />
        </div>
      </div>
      <header style={{maxWidth:1200,margin:'140px auto 0',padding:'0 32px'}}>
        <div style={{display:'flex',gap:12,marginBottom:24}}>
          <Badge tone="outline">UI/UX</Badge>
          <Badge tone="outline">Web Design</Badge>
          <Badge tone="outline">Digital Marketing</Badge>
        </div>
        <h1 style={{fontSize:'clamp(48px,7vw,96px)',fontWeight:500,letterSpacing:'-.035em',lineHeight:1,margin:'0 0 16px'}}>Digital Aura Marketing</h1>
        <p style={{fontSize:20,color:'var(--text-muted)',maxWidth:'60ch',margin:'0 0 48px',lineHeight:1.5}}>Landing Page · 2025 · Digital Marketing</p>
        <div style={{aspectRatio:'16/9',borderRadius:'var(--radius-5)',overflow:'hidden',border:'1px solid var(--border)'}}>
          <img src="./thumb.png" alt="Digital Aura Marketing hero" style={{width:'100%',height:'100%',objectFit:'cover'}} />
        </div>
      </header>
      <section style={{maxWidth:1200,margin:'80px auto',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:24,color:'#61D9EE'}}>Project Overview</h2>
        <h3 style={{fontSize:24,fontWeight:500,letterSpacing:'-.02em',marginBottom:16,color:'#61D9EE'}}>Performance Marketing Landing Page</h3>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:32}}><a href="https://digitalauramarketing.ae/" target="_blank" rel="noopener" style={{color:'#61D9EE'}}>Digital Aura</a> is a marketing agency in Dubai that runs Google Ads for businesses across the UAE and the GCC. I had already worked on their main website, so when they came back and asked for a separate landing page for their performance marketing service, they gave me full freedom to design it however I wanted.</p>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}>I didn't want to just copy the old site. I wanted this page to feel more premium and a bit different from the usual agency websites you see in Dubai. So I went with a dark background, some soft gradient lighting, and a neomorphism style for the cards and buttons to give it that clean, modern, "digital" look.</p>
        <div style={{borderRadius:'var(--radius-5)',overflow:'hidden',border:'1px solid var(--border)',marginBottom:48}}>
          <img src="./overview.png" alt="Digital Aura design" style={{width:'100%',display:'block'}} />
        </div>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}>The page walks the visitor through a simple flow: point out the problem they're having with their ads, show why Digital Aura can be trusted, explain how the process works, back it up with real numbers, and end with a form to book a free strategy call. I also made a full Arabic version of the same page for Dubai's Arabic-speaking audience. The client was really happy with how clean it turned out, and both versions are now live.</p>
      </section>
      <section style={{maxWidth:1200,margin:'0 auto 80px',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:24,color:'#61D9EE'}}>Design Challenges</h2>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:32,paddingLeft:24,borderLeft:'3px solid #61D9EE'}}>Most marketing agency pages in Dubai look the same - bright colors, flat layouts, lots of stock photos. My first challenge was making Digital Aura stand out without making it look weird or untrustworthy. The dark theme with neomorphism helped it feel different but still professional.</p>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:32,paddingLeft:24,borderLeft:'3px solid #61D9EE'}}>Neomorphism was the second challenge. It looks great, but if you're not careful the text becomes hard to read and buttons stop looking like buttons. So I used the soft style only for cards and boxes, kept the text sharp and readable, and used the bright cyan color only for links and buttons so people always know where to click.</p>
        <div style={{borderRadius:'var(--radius-5)',overflow:'hidden',border:'1px solid var(--border)',marginBottom:32}}>
          <img src="./neomorphism.png" alt="Neomorphism design elements" style={{width:'100%',display:'block'}} />
        </div>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:32,paddingLeft:24,borderLeft:'3px solid #61D9EE'}}>The third challenge was that marketing is not a physical product. There's nothing to photograph. So I had to make an invisible service feel real by showing a clear step-by-step process and putting real results and numbers on the page.</p>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48,paddingLeft:24,borderLeft:'3px solid #61D9EE'}}>And finally, the same design had to work in both English and Arabic. Arabic reads right to left, so I couldn't just translate the words. I had to flip the whole layout so it feels natural to an Arabic reader, not like an English page with Arabic pasted on top.</p>
      </section>
      <section style={{maxWidth:1200,margin:'0 auto 80px',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:24,color:'#61D9EE'}}>My Approach</h2>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:32,fontStyle:'italic'}}>Before touching any colors or fonts, I thought about the questions a business owner asks before hiring an agency: Do you understand my problem? Can I trust you? How does this work? Does it actually get results? How do I start? I built the sections in that exact order so the page answers each question at the right moment.</p>
        <p style={{fontSize:18,lineHeight:1.7,color:'var(--text-muted)',marginBottom:48}}>For the look, I picked a dark background because it feels more tech and digital, and it also makes the soft neomorphic cards stand out better. I used one main accent color (the cyan gradient) everywhere that matters - headings, buttons, active items - so the eye always knows where to go next.</p>
      </section>
      <section style={{maxWidth:1200,margin:'0 auto 80px',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:48,color:'#61D9EE'}}>UX Problems Solved</h2>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'32px 40px'}}>
          {[
            ['01','Problem-First Opening','Instead of talking about the agency first, the page opens with the visitor\'s real pain - ad money going out with no results. This makes people feel understood right away and keeps them reading.'],
            ['02','A Complex Service Made Simple','Performance marketing can sound confusing, so I broke it into a clear 4-step framework. Now visitors instantly understand how the whole process works without any guesswork.'],
            ['03','Trust Placed Where Doubt Begins','The certification badge, case studies, and result numbers are placed exactly where people usually start to doubt an agency. Their worries get answered on the spot instead of later.'],
            ['04','Real Numbers Instead of Empty Claims','Rather than vague promises, the page shows actual results like 150+ campaigns, 25M+ AED revenue, and 4.2x ROAS - so visitors can judge the agency on proof, not words.'],
            ['05','One Clear Path to Action','I used a single accent color for every button and link, so there\'s never any confusion about what to click or where to go next.'],
            ['06','A Low-Pressure First Step','The main action is a free strategy session, not a hard sell, with a LinkedIn option too. This makes reaching out feel easy and risk-free.'],
            ['07','Readable Even With a Bold Style','The soft neomorphism look stays clean and high-contrast, so the design feels premium without ever becoming hard to read.'],
            ['08','A True Bilingual Experience','I built a proper right-to-left Arabic version, so Arabic-speaking users get the same smooth experience as English users - not a rushed translation.'],
          ].map(([num, title, desc]) => (
            <div key={num} style={{padding:'28px 0',borderTop:'1px solid var(--border)'}}>
              <div style={{fontSize:13,fontFamily:'var(--font-mono)',color:'#61D9EE',marginBottom:10,letterSpacing:'.06em'}}>{num}</div>
              <h3 style={{fontSize:18,fontWeight:600,letterSpacing:'-.01em',margin:'0 0 10px',color:'#61D9EE'}}>{title}</h3>
              <p style={{fontSize:15,lineHeight:1.7,color:'var(--text-muted)',margin:0}}>{desc}</p>
            </div>
          ))}
        </div>
      </section>
      <section style={{maxWidth:1200,margin:'0 auto 80px',padding:'0 32px'}}>
        <h2 style={{fontSize:32,fontWeight:500,letterSpacing:'-.02em',marginBottom:32,color:'#61D9EE'}}>Final Design</h2>
        <div style={{borderRadius:'var(--radius-5)',overflow:'hidden',border:'1px solid var(--border)'}}>
          <img src="./final-design.png" alt="Digital Aura final design" style={{width:'100%',display:'block'}} />
        </div>
      </section>
      
      {/* EXPLORE MORE */}
      <div style={{textAlign:'center',padding:'60px 32px 0'}}>
        {(()=>{
          const [h, setH] = React.useState(false);
          const [h2, setH2] = React.useState(false);
          return <div style={{display:'flex',gap:16,justifyContent:'center',flexWrap:'wrap'}}>
            <a href="../../index.html#work" onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{display:'inline-flex',alignItems:'center',gap:10,padding:'14px 36px',borderRadius:999,background:h?'#fff':'var(--accent)',color:h?'#895B8A':'var(--ink-0)',textDecoration:'none',fontSize:18,fontFamily:'var(--font-sans)',fontWeight:500,transition:'all .2s ease',transform:h?'scale(1.04)':'scale(1)',boxShadow:h?'0 0 20px rgba(137,91,138,.4)':'none',border:h?'1px solid rgba(255,255,255,.35)':'1px solid transparent'}}>Explore More Work →</a>
            <a href="https://digitalauramarketing.ae/english-landing-page" target="_blank" rel="noopener" onMouseEnter={()=>setH2(true)} onMouseLeave={()=>setH2(false)} style={{display:'inline-flex',alignItems:'center',gap:10,padding:'14px 36px',borderRadius:999,background:h2?'#fff':'#61D9EE',color:h2?'#61D9EE':'#0a0a0a',textDecoration:'none',fontSize:18,fontFamily:'var(--font-sans)',fontWeight:500,transition:'all .2s ease',transform:h2?'scale(1.04)':'scale(1)',boxShadow:h2?'0 0 20px rgba(97,217,238,.4)':'none',border:h2?'1px solid rgba(97,217,238,.35)':'1px solid transparent'}}>Check it Live →</a>
          </div>;
        })()}
      </div>

      {/* FOOTER */}
      <footer id="contact" style={{padding:'120px 32px 80px',maxWidth:1200,margin:'0 auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:80,alignItems:'start'}}>
          <div>
            <img src="../../logo.png" alt="Tulsi Bhuva" style={{width:58,height:57,borderRadius:'50%',objectFit:'cover',marginBottom:24}} />
            <div style={{fontSize:22,fontWeight:500,letterSpacing:'-.02em',lineHeight:1.4,marginBottom:16}}>Hi. 3 years in, 40+ things shipped. I don't chase trends. I don't design for Dribbble. I don't ship what I wouldn't click on myself.</div>
            <div style={{display:'flex',flexDirection:'column',gap:8,color:'var(--text-muted)',marginBottom:20,maxWidth:'52ch',lineHeight:1.6}}><div>Drop me a note with the role, the company, and what the team is building - I'll reply within a day.</div><div>Open to full-time, contract, or freelance. Remote-first, based in Ahmedabad (IST).</div></div>
            <div style={{display:'flex',flexDirection:'column',gap:12,marginBottom:32}}>
              <a href="mailto:tulsibhuva4040@gmail.com" style={{display:'inline-flex',alignItems:'center',gap:10,textDecoration:'none',color:'var(--text-muted)',fontSize:15}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#895B8A"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                tulsibhuva4040@gmail.com
              </a>
              <div style={{display:'inline-flex',alignItems:'center',gap:10,color:'var(--text-muted)',fontSize:15}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#895B8A"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                Ahmedabad, India
              </div>
            </div>
            <a href="https://www.linkedin.com/in/tulsi-bhuva-0212ab23a/" target="_blank" rel="noopener"><Button variant="accent" size="lg" iconLeft={<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>}>Let's Talk</Button></a>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:16,paddingTop:8}}>
            {[
              ['LinkedIn','https://www.linkedin.com/in/tulsi-bhuva-0212ab23a/'],
              ['Behance','https://www.behance.net/tulsiibhuva'],
              ['Dribbble','https://dribbble.com/TulsiBhuva'],
              ['Instagram','https://www.instagram.com/_tulsi_bhuva/'],
            ].map(([label,href],i)=>{
              const [h, setH] = React.useState(false);
              return (
              <a key={i} href={href} target="_blank" rel="noopener" onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'20px 0',borderBottom:'1px solid var(--border)',textDecoration:'none',color:h?'#C185C3':'var(--text)',fontSize:18,fontWeight:500,transition:'color .2s ease, padding-left .2s ease',paddingLeft:h?8:0}}>
                {label} <span style={{color:h?'#C185C3':'var(--text-dim)',fontSize:14,transition:'color .2s ease, transform .2s ease',transform:h?'translateX(4px)':'none',display:'inline-block'}}>→</span>
              </a>
            );})}
          </div>
        </div>
        <div style={{marginTop:80,paddingTop:24,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',color:'var(--text-dim)',fontSize:13,fontFamily:'var(--font-mono)'}}>
          <div>Designed & built by Tulsi Bhuva</div>
          <div style={{display:'flex',alignItems:'center',gap:24}}>
            <div>© 2026</div>
            <div onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} style={{width:40,height:40,borderRadius:999,border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all .2s ease'}} onMouseEnter={e=>{e.currentTarget.style.background='#895B8A';e.currentTarget.style.borderColor='#895B8A'}} onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='var(--border)'}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            </div>
          </div>
        </div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
